plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nfs.recompiled'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nfs.recompiled'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'

        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                arguments "-DGAME=${project.findProperty('GAME')}",
                          "-DUPSTREAM=${project.findProperty('UPSTREAM')}",
                          "-DSDL_DIR=${project.findProperty('SDL_DIR')}",
                          "-DGL4ES_DIR=${project.findProperty('GL4ES_DIR')}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
